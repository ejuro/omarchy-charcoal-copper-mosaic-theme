background-alpha = 1.0
text = "#E2CDBC"
border = "#594335"
border-alpha = 1.0
border-width = 1
countdown = "#C48B64"

[launcher]
background = "#171717"
background-alpha = 1.0
text = "#E2CDBC"
border = "#594335"
