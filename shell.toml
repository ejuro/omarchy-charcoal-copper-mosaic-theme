selected-background = "#493428"
selected-background-alpha = 1.0
selected-text = "#F0DFD0"
selected-border = "#C48B64"
selected-border-alpha = 0.35

[menu]
background = "#171717"
background-alpha = 1.0
text = "#E2CDBC"
border = "#594335"
border-alpha = 1.0
scrim = "#0A0A0A"
scrim-alpha = 0.35
selected-background = "#493428"
selected-background-alpha = 1.0
selected-text = "#F0DFD0"
selected-border = "#C48B64"
